<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login · Wedding Seating Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=1">
<link rel="stylesheet" href="/login-style.css?v=1">
</head>
<body class="loginBody">
<div class="loginWrap">
  <div class="loginCard">
    <div class="loginBrand">♥ Wedding Seating Planner</div>
    <h1>Admin Login</h1>
    <form id="loginForm">
      <input id="username" class="search" name="username" placeholder="Username" autocomplete="username" autofocus>
      <input id="password" class="search" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <div id="loginError" class="loginError hidden"></div>
      <button type="submit" class="primary loginSubmit">Log In</button>
    </form>
  </div>
</div>
<script src="/login.js?v=1"></script>
</body>
</html>
