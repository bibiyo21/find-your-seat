<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Your Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/checkin-style.css?v=1787070054">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>♥ Find Your Seat ♥</h1>
    <p id="eventName" class="event-name"></p>
  </div>
  
  <div class="content">
    <div class="search-section">
      <h2>Find Your Name</h2>
      <input id="guestSearch" class="search-input" type="text" placeholder="Type your name..." autocomplete="off">
      <div id="searchResults" class="results"></div>
    </div>
    
    <div id="guestInfo" class="guest-info hidden">
      <div class="guest-card">
        <div class="guest-name-display" id="guestName"></div>
        <div class="table-label">Table</div>
        <div class="table-number-display" id="guestTable"></div>
        <button id="backBtn" class="back-btn">Back to Search</button>
      </div>
    </div>
  </div>
</div>

<script src="/checkin.js?v=1787070054"></script>
</body>
</html>
